# Local development: one Postgres (with pgvector) used as the metastore and by the
# integration tests, and one MySQL for the MySQL connector tests. To run Datalyst itself, use deploy/compose.yaml.
name: datalyst

services:
  metastore:
    image: pgvector/pgvector:pg16
    container_name: datalyst-metastore
    environment:
      POSTGRES_USER: datalyst
      POSTGRES_PASSWORD: datalyst
      POSTGRES_DB: datalyst
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - metastore-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datalyst -d datalyst"]
      interval: 2s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    container_name: datalyst-mysql
    environment:
      MYSQL_ROOT_PASSWORD: datalyst
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pdatalyst --silent"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  metastore-data:

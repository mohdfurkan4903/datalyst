# Local development: one Postgres (with pgvector) used as the metastore and by the
# integration tests. To run Datalyst itself, use deploy/compose.yaml.
name: datalyst

services:
  metastore:
    image: pgvector/pgvector:pg16
    container_name: datalyst-metastore
    environment:
      POSTGRES_USER: datalyst
      POSTGRES_PASSWORD: datalyst
      POSTGRES_DB: datalyst
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - metastore-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datalyst -d datalyst"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  metastore-data:

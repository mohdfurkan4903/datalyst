[project]
name = "datalyst"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohd Furkan", email = "furkan4903@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "langchain>=1.5.2",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "rich>=15.0.0",
    "sqlglot>=30.33.0",
    "typer>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
datalyst = "datalyst.cli:app"

[project.optional-dependencies]
anthropic = [
    "langchain-anthropic>=1.7.12",
]
google = [
    "langchain-google-genai>=4.5.2",
]
ollama = [
    "langchain-ollama>=1.1.0",
]
ui = [
    "plotly>=7.1.0",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs the Postgres from docker compose"]

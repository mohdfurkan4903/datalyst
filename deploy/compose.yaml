name: datalyst-deploy

x-app: &app
  image: ${DATALYST_IMAGE:-datalyst:latest}
  build:
    context: ..
    dockerfile: Dockerfile
  env_file: .env
  environment:
    DATALYST_METASTORE_URL: ${DATALYST_METASTORE_URL:-postgresql://datalyst:${METASTORE_PASSWORD}@metastore:5432/datalyst}
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  metastore:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: datalyst
      POSTGRES_PASSWORD: ${METASTORE_PASSWORD:?set METASTORE_PASSWORD in deploy/.env}
      POSTGRES_DB: datalyst
    volumes:
      - metastore-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datalyst -d datalyst"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      metastore:
        condition: service_healthy

  api:
    <<: *app
    command: ["api", "--host", "0.0.0.0", "--port", "8000", "--workers", "${API_WORKERS:-2}"]
    environment:
      DATALYST_METASTORE_URL: ${DATALYST_METASTORE_URL:-postgresql://datalyst:${METASTORE_PASSWORD}@metastore:5432/datalyst}
      HEALTH_PORT: "8000"
      HEALTH_PATH: /ready
    volumes:
      - files:/data/files

  worker:
    <<: *app
    command: ["worker"]
    healthcheck:
      disable: true
    volumes:
      - files:/data/files
    deploy:
      replicas: ${WORKER_REPLICAS:-1}

  ui:
    <<: *app
    entrypoint: ["streamlit", "run", "ui/app.py"]
    command: ["--server.port", "8501", "--server.address", "0.0.0.0"]
    environment:
      DATALYST_UI_API_URL: http://api:8000
      HEALTH_PORT: "8501"
      HEALTH_PATH: /_stcore/health
    depends_on:
      api:
        condition: service_healthy

  proxy:
    image: caddy:2
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_healthy
    restart: unless-stopped

volumes:
  metastore-data:
  files:
  caddy-data:
  caddy-config:
